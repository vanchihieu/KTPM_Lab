spring.application.name=product-service
server.port=8081

# Database configuration for Docker environment
spring.datasource.url=jdbc:mysql://product-db:3306/product_service_db
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka client configuration for Docker environment
eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka
eureka.instance.prefer-ip-address=true

# RabbitMQ Configuration for Docker environment
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.queues.order-created=order_created_queue
spring.rabbitmq.queues.order-cancelled=order_cancelled_queue

# Actuator settings
management.endpoints.web.exposure.include=*