version: "3.8"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    image: myapp:latest

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

# run: docker-compose -f docker-compose-prod.yml up --build
