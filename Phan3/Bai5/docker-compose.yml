version: '3.8'

services:
  vote:
    build: ./vote
    ports:
      - "5000:80"
    networks:
      - frontend
      - backend

  result:
    build: ./result
    ports:
      - "5001:80"
    networks:
      - backend

  worker:
    build: ./worker
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pgdata:

networks:
  frontend:
  backend:
