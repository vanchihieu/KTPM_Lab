spring.application.name=api-gateway
server.port=8080

# Eureka client configuration - more resilient settings
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.preferIpAddress=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10

eureka.instance.lease-expiration-duration-in-seconds=20
# Increase timeout to allow more time for registration
eureka.client.eureka-server-connect-timeout-seconds=30
eureka.client.eureka-server-read-timeout-seconds=30

# Routes configuration
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=productServiceCircuitBreaker,/product-fallback
spring.cloud.gateway.routes[0].filters[1]=RequestRateLimiter=3, 1, 1
spring.cloud.gateway.routes[0].filters[2]=Retry

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=orderServiceCircuitBreaker,/order-fallback
spring.cloud.gateway.routes[1].filters[1]=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[2]=Retry

spring.cloud.gateway.routes[2].id=customer-service
spring.cloud.gateway.routes[2].uri=lb://customer-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/customers/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=customerServiceCircuitBreaker,/customer-fallback
spring.cloud.gateway.routes[2].filters[1]=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[2]=Retry

# Circuit Breaker configurations
spring.cloud.gateway.filter.circuit-breaker.enabled=true
spring.cloud.circuitbreaker.resilience4j.enabled=true

# Rate limiting configurations
spring.cloud.gateway.filter.request-rate-limiter.deny-empty-key=false
spring.cloud.gateway.filter.request-rate-limiter.empty-key-status-code=429
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin

# Redis rate limiter configuration
spring.cloud.gateway.redis-rate-limiter.replenish-rate=3
spring.cloud.gateway.redis-rate-limiter.burst-capacity=5
spring.cloud.gateway.redis-rate-limiter.requested-tokens=1

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Resilience4j CircuitBreaker configurations
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.slidingWindowType=COUNT_BASED

resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.slidingWindowType=COUNT_BASED

resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.slidingWindowType=COUNT_BASED

# Time Limiter configurations
resilience4j.timelimiter.instances.productServiceTimeLimiter.timeoutDuration=2s
resilience4j.timelimiter.instances.orderServiceTimeLimiter.timeoutDuration=2s
resilience4j.timelimiter.instances.customerServiceTimeLimiter.timeoutDuration=2s

# Retry configurations
resilience4j.retry.instances.retryApi.maxAttempts=3
resilience4j.retry.instances.retryApi.waitDuration=1s
resilience4j.retry.instances.retryApi.enableExponentialBackoff=true

# Actuator settings
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true